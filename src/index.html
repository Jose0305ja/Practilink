<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practilink</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;

      background: #f4f6fb;
      color: #1f2937;
    }
    main {
      max-width: 640px;
      padding: 32px;

    }
    h1 {
      font-size: 3rem;
      margin: 0 0 16px;

    }

      line-height: 1.6;
    }

<body>
  <main>
    <h1>Practilink</h1>
    <p>
      Plataforma web que conecta a los alumnos de la UTD con empresas de

      recomendaciones y reseñas de exalumnos en un solo lugar.
    </p>
